version: 2

models:
  - name: dim_<entity>
    description: "One row per <entity> (per version, if SCD2). Type <1 or 2> dimension."
    columns:
      - name: <entity>_key
        description: "Surrogate key. Join target for fact tables."
        tests:
          - unique
          - not_null
      - name: <entity>_id
        description: "Natural key from the source system."
        tests:
          - not_null
      - name: <entity>_category
        description: "Business-defined category."
        tests:
          - accepted_values:
              values: ['category_a', 'category_b', 'category_c']

  - name: fct_<entity>
    description: >
      Transaction fact. Grain: one row per <precise grain statement, e.g.
      'order line item'>. <Note here if any measure is semi-additive or
      non-additive.>
    columns:
      - name: <entity>_id
        description: "Natural key of the fact event."
        tests:
          - unique
          - not_null
      - name: customer_key
        description: "FK to dim_customers, resolved as of the event timestamp for SCD2."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: amount
        description: "Additive measure. Safe to SUM across all dimensions."
        tests:
          - not_null
