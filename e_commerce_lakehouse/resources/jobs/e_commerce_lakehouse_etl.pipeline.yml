# The main pipeline for e_commerce_lakehouse

resources:
  pipelines:
    e_commerce_lakehouse_etl:
      name: e_commerce_lakehouse_etl
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      root_path: "../../src/e_commerce_lakehouse/silver"

      libraries:
        - glob:
            include: ../../src/e_commerce_lakehouse/silver/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
