# This is a Databricks asset bundle definition for e_commerce_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: e_commerce_lakehouse
  uuid: 985a9b7a-b660-49e8-87b2-6c6273cdc101

include:
  - resources/**/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: e_commerce
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-fcdc542c-133d.cloud.databricks.com
    variables:
      catalog: e_commerce
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-fcdc542c-133d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/arthurtelescoutinho@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/arthurtelescoutinho@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: e_commerce
      schema: prod
    permissions:
      - user_name: arthurtelescoutinho@gmail.com
        level: CAN_MANAGE
